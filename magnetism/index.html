<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁场 · 物理图谱</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../vendor/fonts/noto-serif-sc/400.css">
<link rel="stylesheet" href="../atlas.css">
<link rel="stylesheet" href="../engine/book.css">
<link rel="expect" href="#right" blocking="render">
<script src="../engine/cover.js"></script>
<style>
  /* this chapter: B is grey, and ⊗ marks a field into the page */
  .lbl.vec.grey { color: #6c6c72; }
  .lbl.mark { font: 15px/1 var(--serif); color: #86868c; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>

<body class="book-body">
  <header class="topbar">
    <a href="../" class="brand">物理图谱</a>
    <span class="crumb">第 14 章 · 磁场</span>
    <nav class="dots" id="dots" aria-label="页面"></nav>
  </header>

  <div class="scroll-space" id="space"></div>

  <main class="book" id="book">
    <section class="page left" id="left" aria-live="polite">
      <article class="sheet" id="sheet"></article>
      <article class="plate" id="plate" hidden></article>
      <footer class="folio"><span>磁场</span><span id="folio">1</span></footer>
    </section>

    <section class="page right" id="right">
      <div class="figure">
        <canvas id="gl" aria-label="交互图：磁场中的磁体、运动电荷、导线和线圈。把鼠标移到某个场景上，点击即可拆解。"></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div class="corner tl" id="figno">图 1</div>
        <div class="corner tr" id="figtitle"></div>
        <div class="corner bl" id="hint">拖动旋转 · 按住 Shift 拖动平移 · 点击拆解</div>
        <div class="corner br readout" id="readout"></div>
      </div>
    </section>

    <div class="leaf" id="leaf" aria-hidden="true">
      <div class="leaf-front"><span id="leafnext"></span></div>
      <div class="leaf-back"><article class="sheet" id="leafsheet"></article></div>
    </div>
    <div class="spine" aria-hidden="true"></div>
  </main>

  <p class="scroll-cue" id="cue">滚动翻页</p>
  <script type="module" src="main.js"></script>
</body>
</html>
